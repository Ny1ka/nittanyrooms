<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nittany Rooms</title>
    <meta
      name="description"
      content="Find study rooms you can reserve at Penn State University Park, see where they are, and continue to the official Penn State reservation page. Student-made, not an official Penn State service."
    />
    <meta name="theme-color" content="#0A1628" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/overpass-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/overpass-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Dark by default; remember the visitor's choice. Runs before paint to avoid a flash.
      try {
        var t = localStorage.getItem('nr-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
